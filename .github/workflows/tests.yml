name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.18.x", "1.19.x", "1.20.x", "1.21.x", "1.22.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Test
        run: make test
